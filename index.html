<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity CLI Bridge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #30363d;
      padding-bottom: 12px;
    }
    h1 { margin: 0; font-size: 20px; }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
    }
    .badge.connected {
      background: #0d2a1a;
      border-color: #238636;
      color: #3fb950;
    }
    #log {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      min-height: 280px;
      max-height: 460px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .entry {
      padding: 8px 10px;
      border-radius: 6px;
      background: #0d1117;
      border-left: 3px solid #30363d;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .entry.user { border-left-color: #58a6ff; }
    .entry.cli { border-left-color: #3fb950; }
    .entry.system { border-left-color: #d29922; color: #8b949e; }
    form {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #e6edf3;
      font-size: 14px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #58a6ff;
    }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: 1px solid #238636;
      background: #238636;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2ea043; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Antigravity CLI Bridge</h1>
      <span id="status" class="badge">Connecting...</span>
    </header>

    <div id="log"></div>

    <form id="prompt-form">
      <input
        id="prompt-input"
        type="text"
        placeholder="Type a prompt to send to the Antigravity CLI..."
        autocomplete="off"
        required
      />
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const form = document.getElementById("prompt-form");
    const input = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");

    function addLog(text, type = "system") {
      const div = document.createElement("div");
      div.className = `entry ${type}`;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Check health
    fetch("/health")
      .then((r) => r.json())
      .then((data) => {
        statusEl.textContent = `Connected (${data.mode})`;
        statusEl.classList.add("connected");
        addLog(`CLI bridge ready — mode: ${data.mode}, agyInstalled: ${data.agyInstalled}`, "system");
      })
      .catch((err) => {
        statusEl.textContent = "Disconnected";
        addLog(`Health check failed: ${err.message}`, "system");
      });

    // Subscribe to live CLI -> Web SSE events
    const events = new EventSource("/events");
    events.addEventListener("cli-message", (e) => {
      const data = JSON.parse(e.data);
      addLog(`[CLI broadcast] ${data.message}`, "cli");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      addLog(`[Web -> CLI] ${prompt}`, "user");
      input.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/prompt", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        if (data.ok) {
          addLog(`[CLI -> Web] ${data.reply}`, "cli");
        } else {
          addLog(`[Error] ${data.error}`, "system");
        }
      } catch (err) {
        addLog(`[Network Error] ${err.message}`, "system");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
