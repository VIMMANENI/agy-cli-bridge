<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity CLI Bridge</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
    }
    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #30363d;
      padding-bottom: 12px;
    }
    h1 { margin: 0; font-size: 20px; }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #8b949e;
    }
    .badge.connected {
      background: #0d2a1a;
      border-color: #238636;
      color: #3fb950;
    }
    .badge.error {
      background: #3d1418;
      border-color: #f85149;
      color: #ff7b72;
    }
    .bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .bar input {
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #e6edf3;
      font-size: 12px;
    }
    #bridge-url { flex: 2; min-width: 200px; }
    #bridge-token { flex: 1; min-width: 120px; }
    .btn-secondary {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #e6edf3;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #30363d; }
    #log {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
      min-height: 280px;
      max-height: 440px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.5;
    }
    .entry {
      padding: 8px 10px;
      border-radius: 6px;
      background: #0d1117;
      border-left: 3px solid #30363d;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .entry.user { border-left-color: #58a6ff; }
    .entry.cli { border-left-color: #3fb950; }
    .entry.system { border-left-color: #d29922; color: #8b949e; }
    form {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #e6edf3;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #58a6ff;
    }
    button[type="submit"] {
      padding: 10px 18px;
      border-radius: 6px;
      border: 1px solid #238636;
      background: #238636;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:hover { background: #2ea043; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Antigravity CLI Bridge</h1>
      <span id="status" class="badge">Connecting...</span>
    </header>

    <div class="bar">
      <input id="bridge-url" type="url" placeholder="CLI Bridge URL (e.g. http://127.0.0.1:4310)" />
      <input id="bridge-token" type="password" placeholder="Optional token" />
      <button id="connect-btn" class="btn-secondary" type="button">Reconnect</button>
    </div>

    <div id="log"></div>

    <form id="prompt-form">
      <input
        id="prompt-input"
        type="text"
        placeholder="Type a prompt to send to the Antigravity CLI..."
        autocomplete="off"
        required
      />
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const form = document.getElementById("prompt-form");
    const input = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");
    const bridgeUrlInput = document.getElementById("bridge-url");
    const bridgeTokenInput = document.getElementById("bridge-token");
    const connectBtn = document.getElementById("connect-btn");

    const params = new URLSearchParams(window.location.search);
    const isLocalOrigin = ["127.0.0.1", "localhost"].includes(window.location.hostname);
    const initialUrl =
      params.get("bridge") ||
      localStorage.getItem("agy_bridge_url") ||
      (isLocalOrigin ? window.location.origin : "http://127.0.0.1:4310");
    const initialToken = params.get("token") || localStorage.getItem("agy_bridge_token") || "";

    bridgeUrlInput.value = initialUrl.replace(/\/+$/, "");
    bridgeTokenInput.value = initialToken;

    let eventSource = null;

    function addLog(text, type = "system") {
      const div = document.createElement("div");
      div.className = `entry ${type}`;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function getBridgeBase() {
      return bridgeUrlInput.value.trim().replace(/\/+$/, "");
    }

    function getAuthHeaders() {
      const token = bridgeTokenInput.value.trim();
      return token ? { Authorization: `Bearer ${token}` } : {};
    }

    function connectBridge() {
      const base = getBridgeBase();
      const token = bridgeTokenInput.value.trim();
      localStorage.setItem("agy_bridge_url", base);
      localStorage.setItem("agy_bridge_token", token);

      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }

      statusEl.textContent = "Connecting...";
      statusEl.className = "badge";

      fetch(`${base}/health`, { headers: getAuthHeaders() })
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then((data) => {
          statusEl.textContent = `Connected (${data.mode})`;
          statusEl.className = "badge connected";
          addLog(`CLI bridge ready at ${base} — mode: ${data.mode}, agyInstalled: ${data.agyInstalled}`, "system");

          const eventsUrl = token
            ? `${base}/events?token=${encodeURIComponent(token)}`
            : `${base}/events`;
          eventSource = new EventSource(eventsUrl);
          eventSource.addEventListener("cli-message", (e) => {
            const payload = JSON.parse(e.data);
            addLog(`[CLI broadcast] ${payload.message}`, "cli");
          });
        })
        .catch((err) => {
          statusEl.textContent = "Disconnected";
          statusEl.className = "badge error";
          addLog(`Failed to reach ${base}: ${err.message}`, "system");
        });
    }

    connectBtn.addEventListener("click", connectBridge);
    connectBridge();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      const base = getBridgeBase();
      addLog(`[Web -> CLI] ${prompt}`, "user");
      input.value = "";
      sendBtn.disabled = true;
      sendBtn.textContent = "Thinking...";

      try {
        const res = await fetch(`${base}/prompt`, {
          method: "POST",
          headers: { "Content-Type": "application/json", ...getAuthHeaders() },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          addLog(`[CLI -> Web] ${data.reply}`, "cli");
        } else {
          addLog(`[Error ${res.status}] ${data.error || "Request failed"}`, "system");
        }
      } catch (err) {
        addLog(`[Network Error] ${err.message}`, "system");
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "Send";
        input.focus();
      }
    });
  </script>
</body>
</html>
